schema: 1
profile: orfs
technology: asap7

# A change under these paths makes a commit RTL-changing. The configurations
# live in config/target/<name>/.
rtl_paths: [core, common, vendor, ':(glob)config/target/*/rtl_cfg_pkg.sv',
            ':(glob)config/target/*/Flist.cva6_synth']

# tests: programs of the gate-level simulation (synthesis/gsim/tests/hex).
targets:
  # 32-bit, OBI memory subsystem, no caches.
  # rv32: the gate-level programs of the 32-bit configurations with the C extension.
  cv32a65x:
    config: cv32a65x
    top: cva6_example_obi
    flist: core/Flist.cva6
    sram: fakeram
    tests: &rv32 [hello_world-rv32, rv32ui-p-add, rv32ui-p-addi, rv32ui-p-beq, rv32ui-p-jal,
                  rv32ui-p-lw, rv32ui-p-sw, rv32um-p-mul]
  # 64-bit, Sv39, HPDcache over AXI (32 KB D-cache, 16 KB I-cache).
  # profile_rva20s64: RV64IMAFDC + Zcb; profile_rva22s64: + Zba/Zbb/Zbs/Zbc;
  # profile_rva23s64: + the hypervisor extension.
  profile_rva20s64:
    config: profile_rva20s64
    top: cva6_example_axi
    flist: core/Flist.cva6
    sram: fakeram
    tests: &rv64 [hello_world-rv64, rv64ui-p-add, rv64ui-p-addi, rv64ui-p-beq, rv64ui-p-jal,
                  rv64ui-p-ld, rv64ui-p-sd, rv64um-p-mul]
  profile_rva22s64:
    config: profile_rva22s64
    top: cva6_example_axi
    flist: core/Flist.cva6
    sram: fakeram
    tests: *rv64
  profile_rva23s64:
    config: profile_rva23s64
    top: cva6_example_axi
    flist: core/Flist.cva6
    sram: fakeram
    tests: *rv64
  # 32-bit, no MMU, HPDcache over AXI (2 KB write-back D-cache, 2 KB I-cache).
  summit_pilatus:
    config: summit_pilatus
    top: cva6_example_axi
    flist: core/Flist.cva6
    sram: fakeram
    tests: *rv32
  # 64-bit, OBI memory subsystem, no caches.
  profile_rvi20u64:
    config: profile_rvi20u64
    top: cva6_example_obi
    flist: core/Flist.cva6
    sram: fakeram
    tests: &rv64nc [rv64ui-p-add, rv64ui-p-addi, rv64ui-p-beq, rv64ui-p-jal, rv64ui-p-ld,
                    rv64ui-p-sd, rv64um-p-mul]
  summit_barredesecrins:
    config: summit_barredesecrins
    top: cva6_example_obi
    flist: core/Flist.cva6
    sram: fakeram
    tests: *rv64
  summit_grandparadis:
    config: summit_grandparadis
    top: cva6_example_obi
    flist: core/Flist.cva6
    sram: fakeram
    tests: *rv64
  # 32-bit, OBI memory subsystem, no caches; shared TLB.
  summit_dammastock:
    config: summit_dammastock
    top: cva6_example_obi
    flist: core/Flist.cva6
    sram: fakeram
    tests: &rv32nc [rv32ui-p-add, rv32ui-p-addi, rv32ui-p-beq, rv32ui-p-jal, rv32ui-p-lw,
                    rv32ui-p-sw, rv32um-p-mul]
  # Further HPDcache configurations over AXI. hello_world needs the C extension;
  # the configurations without it run the other programs (rv32nc, rv64nc).
  # 32-bit:
  profile_perf32_axi:
    config: profile_perf32_axi
    top: cva6_example_axi
    flist: core/Flist.cva6
    sram: fakeram
